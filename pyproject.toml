[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecg-biometrics-course"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.12,<2",
    "scikit-learn>=1.4,<2",
    "wfdb>=4.2,<5",
]

[project.optional-dependencies]
neural = ["torch>=2.5,<3"]
test = ["pytest>=8,<10"]

[tool.setuptools]
packages = ["ecg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
